spring.application.name=soulup-api

# Conexao com o Oracle da FIAP.
# Os valores entre ${} sao variaveis de ambiente com valor padrao depois dos dois-pontos:
# rodando local sem configurar nada, usa o padrao; no Render, o painel sobrescreve.
# A senha NAO tem valor padrao de proposito - este arquivo vai para um repositorio publico.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}
spring.datasource.username=${DB_USER:rm570539}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# O Render injeta a porta pela variavel PORT; local cai no 8080
server.port=${PORT:8080}
